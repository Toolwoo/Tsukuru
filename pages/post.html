    <header>

            <h1>💬 Present a Thought. 💬</h1>
            <p>Uncreative Motherfucker</p>

        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="comment-page">
            <!-- Authentication Required Notice -->
            <div id="auth-notice" class="auth-notice" style="display: none;">
                <div class="notice-content">
                    <h3>🔐 Log Masuk Diperlukan</h3>
                    <p>Sila log masuk atau daftar akaun untuk menghantar komen.</p>
                    <div class="notice-buttons">
                        <button onclick="openLoginModal()" class="btn btn-primary">Log Masuk</button>
                        <button onclick="openSignupModal()" class="btn btn-secondary">Daftar Akaun</button>
                    </div>
                </div>
            </div>

            <!-- Comment Form -->
            <form id="comment-form" class="comment-form">
                <h2 style="text-align: center; margin-bottom: 30px; color: white;">
                    Post a Thought
                </h2>
                
                <div class="form-group">
                    <label for="nama">Title : </label>
                    <input 
                        type="text" 
                        id="nama" 
                        name="nama" 
                        placeholder="Write the Title"
                        required
                    >
                </div>

                <div class="form-filter">
                    <label>Filter: 
                        <select id="filter">
                        <option value="deep-dive">Deep Dive</option>
                        <option value="short-thoughts">Short Thoughts</option>
                        </select>
                    </label>
                </div>

                <div class="form-group">
                    <label for="komen">Write an idea..</label>
                    <textarea 
                        id="komen" 
                        name="komen" 
                        placeholder="Write an idea"
                        required
                    ></textarea>
                </div>
                
                <button type="submit" class="submit-btn">
                    Post !
                </button>
            </form>

            <!-- Comments Display -->
            <div class="comments-section">
                <h2 style="text-align: center; margin: 40px 0 30px 0; color: white;">
                    💭 Komen Terdahulu
                </h2>
                <div id="comments-list" class="comments-list">
                    <div class="loading" style="text-align: center; color: white; padding: 20px;">
                        Memuatkan komen...

            </div>

            <!-- Back to Home -->

                    <span>← Kembali ke Halaman Utama</span>
                </a>
            </div>
        </div>
    </main>

<!-- Supabase Library -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/supabase.min.js"></script>

  <!-- Thoughts Script -->
  <script type="module">
    // Initialize Supabase
    const SUPABASE_URL = "https://hjpjtufobzttssidfexf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqcGp0dWZvYnp0dHNzaWRmZXhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MTY0OTQsImV4cCI6MjA3OTM5MjQ5NH0.xAAAGortVAhOIeKoMyWNvJDrc0kr0FjfTzn3V99wFS0"; // replace with your anon key
    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("thoughtForm");
    const textEl = document.getElementById("thoughtText");
    const catEl = document.getElementById("thoughtCategory");
    const thoughtsDiv = document.getElementById("thoughts");

    // Submit a new thought
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = textEl.value.trim();
      const category = catEl.value.trim() || null;

      if (!text) return alert("Please write a thought!");

      const { data, error } = await supabase
        .from("thoughts")
        .insert([{ text, category }]);

      if (error) {
        console.error(error);
        alert("Failed to submit. Check console.");
      } else {
        textEl.value = "";
        catEl.value = "";
        loadThoughts();
      }
    });

    // Load all thoughts
    async function loadThoughts() {
      const { data, error } = await supabase
        .from("thoughts")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);
        thoughtsDiv.innerHTML = "<p style='color:red'>Failed to load thoughts.</p>";
        return;
      }

      if (!data || data.length === 0) {
        thoughtsDiv.innerHTML = '<div style="text-align: center; color: white; padding: 20px;">No thoughts yet. Be the first!</div>';
        return;
      }

      thoughtsDiv.innerHTML = data.map(t => `
        <div class="comment-item" style="padding:8px; border-bottom:1px solid #eee;">
          <strong>${t.category || "Uncategorized"}</strong>: ${t.text}
          <div class="comment-date">${new Date(t.created_at).toLocaleString()}</div>
        </div>
      `).join('');
    }

    // Initial load
    loadThoughts();
  </script>
</body>
</html>
