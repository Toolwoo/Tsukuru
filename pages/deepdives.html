<div id="thoughts-list"></div>

<script type="module">
import { createClient } from "https://cdn.skypack.dev/@supabase/supabase-js";

const SUPABASE_URL = "https://hjpjtufobzttssidfexf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqcGp0dWZvYnp0dHNzaWRmZXhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MTY0OTQsImV4cCI6MjA3OTM5MjQ5NH0.xAAAGortVAhOIeKoMyWNvJDrc0kr0FjfTzn3V99wFS0";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadThoughts() {
  const { data, error } = await supabase
    .from("thoughts")
    .select("*")
    .eq("category", "short-thoughts")
    .order("created_at", { ascending: false });

  const div = document.getElementById("thoughts-list");

  if (error) {
    div.innerHTML = "<p>Error loading thoughts</p>";
    return;
  }

  if (!data || data.length === 0) {
    div.innerHTML = "<p>No short thoughts yet!</p>";
    return;
  }

  div.innerHTML = data.map(t => `
    <div>
      <strong>${t.category}</strong>: ${t.text}
      <small>${new Date(t.created_at).toLocaleString()}</small>
    </div>
  `).join('');
}

loadThoughts();
</script>
</body>
