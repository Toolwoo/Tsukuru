<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tsukuru | Short Thoughts</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" type="image/png" href="../assets/images/logo.jpg">
</head>
<body>
  <!-- Navigation Menu -->
  <nav>
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <img src="../assets/images/logo.jpg" alt="Logo">
      </a>
      <div class="nav-links">
        <a href="board.html" class="nav-link active">💬 Board</a>
        <a href="aboutme.html" class="nav-link">👀 About Me</a>
        <a href="post.html" class="nav-link">💭 Post!</a>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <header>
    <div class="header-content">
      <h1>💬 Idea Board 💬</h1>
      <p>Short Thoughts</p>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div id="thoughts-list" class="comments-list">
      <div class="loading" style="text-align: center; color: white; padding: 20px;">
        Loading thoughts...
      </div>
    </div>

    <!-- Back to Home -->
    <div class="back-home">
      <a href="../index.html" class="back-btn">← Back to Home Page</a>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <p>&copy; Faiz Danial bin Mohd Lotfi -- 1 Alfa</p>
    </div>
  </footer>

  <!-- Supabase Script -->
  <script type="module">
    import { createClient } from "https://cdn.skypack.dev/@supabase/supabase-js";

    const SUPABASE_URL = "https://hjpjtufobzttssidfexf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqcGp0dWZvYnp0dHNzaWRmZXhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MTY0OTQsImV4cCI6MjA3OTM5MjQ5NH0.xAAAGortVAhOIeKoMyWNvJDrc0kr0FjfTzn3V99wFS0"; // replace with your anon key
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadThoughts() {
      const { data, error } = await supabase
        .from("thoughts")
        .select("*")
        .eq("category", "short-thoughts")
        .order("created_at", { ascending: false });

      const div = document.getElementById("thoughts-list");

      if (error) {
        div.innerHTML = "<p>Error loading thoughts</p>";
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        div.innerHTML = "<p>No short thoughts yet!</p>";
        return;
      }

      div.innerHTML = data.map(t => `
        <div class="thought-item">
          <strong>${t.category}</strong>: ${t.text}
          <small>${new Date(t.created_at).toLocaleString()}</small>
        </div>
      `).join('');
    }

    // Initial load
    loadThoughts();
  </script>
</body>
</html>
